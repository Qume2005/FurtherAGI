[package]
name = "intelligent_subject"
version.workspace = true
edition.workspace = true

[features]
default = []

[dependencies]
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
dashmap = "6"
futures-util = "0.3"
quick-xml = { version = "0.40.0", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.21.0"
bollard-stubs = "=1.53.1-rc.29.3.1"
tempfile = "3"
reqwest = { version = "0.13.3", features = ["json"] }
